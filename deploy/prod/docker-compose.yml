# =============================================================================
# deploy/prod/docker-compose.yml — what PRODUCTION runs, verbatim.
# Installed at /opt/shaman_web/docker-compose.yml on the Lightsail host
# (shaman-web-ls, ap-south-1). Copied from the EC2 host on 2026-11-10 during
# the move to Lightsail; the changes are the image (Docker Hub -> GHCR) and removing Watchtower (CI
# now pushes deploys; see deploy.sh).
#
# Every variable lib/env.ts reads is forwarded here (test/deploy/
# compose-env-parity.test.ts enforces it). Optional ones default to empty, which
# keeps the feature OFF until the host .env sets a value — e.g. Fonepay stays
# hidden at checkout until FONEPAY_* credentials are added to .env.
# POSTGRES_PASSWORD has no default: compose refuses to start without it.
# =============================================================================
# Production-grade docker-compose: self-hosts Postgres alongside the app.
# Deploys are pushed by CI: GitHub Actions builds
# ghcr.io/shaman-kathmandu/shamanktmweb:prod-<sha> (private), then SSHes to the
# host with a key that may only run deploy/prod/deploy.sh, which pulls that tag
# and recreates the app. All secrets live in /opt/shaman_web/.env.

services:
  db:
    image: postgres:16-alpine
    container_name: shaman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shaman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-shaman}
    volumes:
      - shaman-db:/var/lib/postgresql/data
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaman} -d ${POSTGRES_DB:-shaman}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shaman

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/shaman-kathmandu/shamanktmweb:prod}
    container_name: shaman-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host nginx proxies to 127.0.0.1:3000; nothing else may reach the app
    # around nginx.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    logging: *logging
    volumes:
      # next/image optimizer cache, kept across deploys so images are not all
      # re-encoded after every release.
      - shaman-image-cache:/app/.next/cache/images
    environment:
      # Docker sets HOSTNAME=<container-id>, which would make the standalone
      # server listen on that name only; the healthcheck and the port mapping
      # need it on every interface.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-shaman}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-shaman}
      SESSION_PASSWORD: ${SESSION_PASSWORD:?set SESSION_PASSWORD in .env (32+ chars)}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@shamankathmandu.com}
      # Only read by the first-boot seed; lib/env.ts rejects "changeme", so
      # the old `:-changeme` default stopped the app booting when unset.
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-ims-shaman-photos}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-https://ims-shaman-photos.s3.ap-south-1.amazonaws.com}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PROJECTX_API_MODE: live
      NEXT_PUBLIC_SITE_MODE: ${NEXT_PUBLIC_SITE_MODE:-live}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://shamankathmandu.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.shamankathmandu.com}
      RUN_DB_SEED: ${RUN_DB_SEED:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Shaman Kathmandu}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      TELEGRAM_SALES_BOT_TOKEN: ${TELEGRAM_SALES_BOT_TOKEN:-}
      TELEGRAM_LEADS_BOT_TOKEN: ${TELEGRAM_LEADS_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      FONEPAY_BASE_URL: ${FONEPAY_BASE_URL:-}
      FONEPAY_BASE_PATH: ${FONEPAY_BASE_PATH:-/api/merchant/third-party/v2}
      FONEPAY_USERNAME: ${FONEPAY_USERNAME:-}
      FONEPAY_PASSWORD: ${FONEPAY_PASSWORD:-}
      FONEPAY_PRIVATE_KEY: ${FONEPAY_PRIVATE_KEY:-}
      FONEPAY_TERMINAL_ID: ${FONEPAY_TERMINAL_ID:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      SEED_STOCK: ${SEED_STOCK:-0}
    networks:
      - shaman

volumes:
  shaman-db:
  shaman-image-cache:

networks:
  shaman:
