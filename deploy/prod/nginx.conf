# =============================================================================
# deploy/prod/nginx.conf
# Host nginx site config for shamankathmandu.com + www — RECONCILED with what
# the live host is actually serving.
#
# This file is the outcome of deploy/prod/RECONCILIATION-2026-08-21.md. Every
# directive below is either (a) copied from the live enabled file so that
# installing this never downgrades production, or (b) a deliberate addition
# recorded in that document's decision table. Do not "simplify" it back toward
# the pre-reconciliation version: the TLS blocks and the 25m body cap are LIVE
# BEHAVIOUR, and dropping them takes the site off HTTPS or starts rejecting
# uploads that work today.
#
# Installed to /etc/nginx/sites-available/shamanktmweb.conf by setup-nginx.sh,
# which chooses THIS file only when Let's Encrypt certificates already exist.
# On a fresh box with no certificates it installs nginx-bootstrap.conf instead
# (http-only), because nginx -t fails on an ssl_certificate path that is not
# there yet. See setup-nginx.sh, section 2.
#
# Before trusting any directive here as live:
#     ssh shaman_web "sudo nginx -T" | grep -n <directive>
#
# Canonical host: www.shamankathmandu.com (apex 301s to www).
# =============================================================================

upstream shamanktmweb_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# apex -> www (301), over HTTPS
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name shamankathmandu.com;

    ssl_certificate     /etc/letsencrypt/live/www.shamankathmandu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.shamankathmandu.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://www.shamankathmandu.com$request_uri;
}

# www (canonical) — proxies to the container
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name www.shamankathmandu.com;

    ssl_certificate     /etc/letsencrypt/live/www.shamankathmandu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.shamankathmandu.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Real client IP. Traffic arrives Cloudflare -> nginx -> app, so
    # $remote_addr is a Cloudflare edge until real_ip rewrites it from
    # CF-Connecting-IP — which nginx only trusts from the ranges below. The
    # proxy blocks then send X-Real-IP / X-Forwarded-For as exactly that one
    # address, overwriting anything the client sent: the app's IP rate limits
    # (lib/oauth/rate-limit.ts clientIp) depend on it not being forgeable.
    # Ranges copied from https://www.cloudflare.com/ips-v4 and /ips-v6
    # (as published 2026). VERIFY against those pages before applying, and
    # re-check when Cloudflare announces changes: a range missing here only
    # degrades limits to per-edge; an extra one lets that network spoof IPs.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    # The product Excel export fetches + downscales every product photo before
    # streaming the file, which can outlast a normal 30s request on a large
    # catalog. Give just this endpoint extra headroom. (The app also caps its
    # own image phase to stay under its budget, so this is defence-in-depth.)
    #
    # NOTE: this block IS live. It was applied to the production host on
    # 2026-08-21 10:42 UTC (HIVE-91), which raised the export budget from the
    # 30s of `location /` to 120s. Before that date the block existed only in
    # this file and was never loaded.
    #
    # EXPORT_PROXY_BUDGET_MS in lib/cms/product-export.ts must match the
    # proxy_read_timeout below — the app sizes its image-phase deadline from
    # it and degrades just under it, so a mismatch means either a 504 (app
    # deadline above the proxy's) or needlessly thin exports (far below it).
    # It is pinned by a test and tracks 120s as of PR #118. Change one and you
    # must change the other.
    location = /api/sysuser/products/export {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 25m;
    }

    # MCP endpoint: upload_media accepts base64 bodies (10 MB decoded ≈ 14 MB
    # on the wire) and fetches remote URLs before answering, so it needs a
    # longer read timeout than the default location.
    #
    # The body cap here is 25m, NOT the 16m originally requested. 16m would
    # have been a CUT: the live host already serves 25m everywhere, so a 16m
    # block would have started rejecting uploads between 16 and 25 MB that
    # work today. See the decision table in RECONCILIATION-2026-08-21.md.
    location = /api/mcp {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25m;
    }

    location / {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 25m;
    }
}

# HTTP -> HTTPS for both names
server {
    listen      80;
    listen      [::]:80;
    server_name shamankathmandu.com www.shamankathmandu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.shamankathmandu.com$request_uri;
    }
}
