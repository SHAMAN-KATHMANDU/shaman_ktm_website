# =============================================================================
# deploy/prod/nginx-bootstrap.conf
# HTTP-ONLY config, for a box that does not have Let's Encrypt certificates yet.
#
# WHY THIS FILE EXISTS
# nginx.conf (the reconciled production config) references
# /etc/letsencrypt/live/www.shamankathmandu.com/fullchain.pem. On a fresh box
# that path does not exist, `nginx -t` fails, and setup-nginx.sh dies before it
# ever reaches certbot — so the box can never obtain the certificates that
# would make the config valid. That is a chicken-and-egg deadlock, and it is
# the reason a single config file cannot serve both cases.
#
# So: setup-nginx.sh installs THIS file when no certificate directory is
# present, runs certbot --nginx against it (certbot needs a plain :80 server
# block with the right server_name to inject TLS into), and from then on the
# box has certificates — at which point re-running setup-nginx.sh installs
# nginx.conf instead.
#
# DO NOT add TLS directives here. If you find yourself wanting to, the box has
# certificates and should be using nginx.conf.
#
# Canonical host: www.shamankathmandu.com (apex 301s to www).
# =============================================================================

upstream shamanktmweb_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# www (canonical) — proxies to the container
server {
    listen      80;
    listen      [::]:80;
    server_name www.shamankathmandu.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /api/sysuser/products/export {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 25m;
    }

    location = /api/mcp {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25m;
    }

    location / {
        proxy_pass         http://shamanktmweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 25m;
    }
}

# apex -> www (301)
server {
    listen      80;
    listen      [::]:80;
    server_name shamankathmandu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.shamankathmandu.com$request_uri;
    }
}
