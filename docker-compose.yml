# Production-grade docker-compose: self-hosts Postgres alongside the app and
# runs Watchtower so deploys are pull-based — GitHub Actions builds + pushes
# rpandox/shamanktmweb:prod, and Watchtower picks the new digest up within
# WATCHTOWER_POLL_INTERVAL seconds (default 60) and recreates the app
# container. No SSH from CI; all secrets live in /opt/shaman_web/.env.

services:
  db:
    image: postgres:16-alpine
    container_name: shaman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shaman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shaman}
      POSTGRES_DB: ${POSTGRES_DB:-shaman}
    volumes:
      - shaman-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shaman} -d ${POSTGRES_DB:-shaman}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shaman

  app:
    image: ${DOCKER_IMAGE:-${DOCKERHUB_USERNAME:-shamanktm}/shamanktmweb:prod}
    container_name: shaman-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Force Next.js standalone server.js to bind to 0.0.0.0 so SSR's
      # same-origin fetch on http://localhost:3000/api works. Docker
      # injects HOSTNAME=<container-id> by default, which makes Next
      # listen on the container hostname only — breaking the loopback fetch.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-shaman}:${POSTGRES_PASSWORD:-shaman}@db:5432/${POSTGRES_DB:-shaman}
      SESSION_PASSWORD: ${SESSION_PASSWORD:?set SESSION_PASSWORD in .env (32+ chars)}
      # ADMIN_BOOTSTRAP_* are only required on the very first deploy (seed
      # uses them to create the initial admin). They can stay empty after
      # that — the env validator + seed both tolerate unset values once an
      # admin exists.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-ims-shaman-photos}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-https://ims-shaman-photos.s3.ap-south-1.amazonaws.com}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PROJECTX_API_MODE: live
      NEXT_PUBLIC_SITE_MODE: ${NEXT_PUBLIC_SITE_MODE:-live}
      # Absolute site origin. Read on the SERVER at runtime (emailed links,
      # OAuth issuer), so it belongs here even though it is NEXT_PUBLIC_ —
      # unlike the build-time NEXT_PUBLIC_PROJECTX_* vars, which are inlined
      # into the client bundle by the Dockerfile and cannot be set here.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      # SMTP (transactional email: order confirmations, status changes,
      # customer password resets). With SMTP_HOST empty lib/email.ts returns a
      # null transport and every send becomes a "[email-dev] would send" console
      # line — the mail is silently dropped, not queued and not retried.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Shaman Kathmandu}
      # Meta Pixel + Conversions API. META_PIXEL_ID has a hardcoded fallback in
      # lib/env.ts so the browser pixel fires either way; META_CAPI_ACCESS_TOKEN
      # has none, and without it server-side Purchase events are simply never
      # sent (no error, no log).
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      # Telegram bots — the reporting system's input layer. Empty tokens
      # disable the bots entirely, which looks identical to "nobody has sent a
      # report today".
      TELEGRAM_SALES_BOT_TOKEN: ${TELEGRAM_SALES_BOT_TOKEN:-}
      TELEGRAM_LEADS_BOT_TOKEN: ${TELEGRAM_LEADS_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Seed runs on EVERY container start while 1 (create-only: it never
      # updates existing rows). Set 1 only for the very first deploy, then
      # back to 0. Watchtower clones the running container's env, so a .env
      # change takes effect only after a manual `docker compose up -d app`.
      RUN_DB_SEED: ${RUN_DB_SEED:-0}
      # One-shot stock import from the master-stock CSV. Paired with
      # RUN_DB_SEED; unreachable from .env unless it is passed through here.
      SEED_STOCK: ${SEED_STOCK:-0}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - shaman

  watchtower:
    # nickfedor/watchtower is the actively-maintained fork; containrrr/watchtower
    # ships a Docker API client that the modern daemon (≥API 1.40) rejects.
    image: nickfedor/watchtower:latest
    container_name: shaman-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Optional: ntfy / email notification hook from the host .env.
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shaman

volumes:
  shaman-db:

networks:
  shaman:
