name: Build & push to GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "deploy/**"
      - "mockup/**"
      - "test/**"
      - ".gitignore"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: build-push-prod
  cancel-in-progress: false

env:
  # GHCR needs a lowercase owner, so the image path is spelled out.
  IMAGE: ghcr.io/shaman-kathmandu/shamanktmweb

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: image
        run: |
          echo "image=${{ env.IMAGE }}:prod-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:prod-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SHAMAN-KATHMANDU/shaman_ktm_website
          cache-from: type=gha,scope=shamanktmweb
          cache-to: type=gha,mode=max,scope=shamanktmweb
          build-args: |
            NEXT_PUBLIC_SITE_MODE=${{ vars.NEXT_PUBLIC_SITE_MODE || 'live' }}
            NEXT_PUBLIC_PROJECTX_API_BASE=
            NEXT_PUBLIC_PROJECTX_ORIGIN=${{ vars.NEXT_PUBLIC_PROJECTX_ORIGIN || 'https://shamankathmandu.com' }}
            S3_PUBLIC_BASE=${{ vars.S3_PUBLIC_BASE || 'https://ims-shaman-photos.s3.ap-south-1.amazonaws.com' }}

# Deploy is pull-based: Watchtower on the Lightsail host polls GHCR and
# recreates shaman-web when :prod moves. No SSH keys or app secrets in GitHub;
# the host /opt/shaman_web/.env is the source of truth. See deploy/prod/README.md.
