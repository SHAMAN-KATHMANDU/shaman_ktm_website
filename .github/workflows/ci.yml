# Pull-request gate. Exists because the Docker image build silently broke on
# main for eight days (2026-08-02 → 2026-08-10): the only workflow ran on push
# to main, so nothing checked a PR before merge.
#
# The build step is the important one. `pnpm verify` passes with env vars
# present, but `next build` collects page data with the builder stage's env —
# which has no DATABASE_URL or SESSION_PASSWORD — and that is exactly the
# condition that broke. So this job deliberately supplies NO secrets: it
# mirrors the Dockerfile's builder stage, where only NEXT_PUBLIC_* and
# S3_PUBLIC_BASE exist.

name: CI

# NO paths-ignore ON THIS TRIGGER. It is deliberate, and removing it was a fix.
#
# `verify` is a REQUIRED status check on main (branch protection). A skipped
# workflow does not report a neutral result — it reports nothing at all. So any
# PR whose files all matched a paths-ignore pattern never produced the `verify`
# context, and the required check waited forever: the PR became permanently
# unmergeable, with no failure anywhere to explain why. A docs-only PR was
# simply stuck.
#
# Found via PR #120 (a single .md runbook), HIVE-122. It would equally have
# trapped any deploy-only or mockup-only PR.
#
# The cost of running CI on a docs-only PR is a few minutes of runner time. The
# cost of not running it was an unmergeable PR and an afternoon spent finding
# out why. Do not re-add paths-ignore here to save those minutes — if this job
# ever needs to skip work, it must still REPORT `verify`, because the required
# check is satisfied by the context existing, not by the work happening.
#
# build-push-prod.yml KEEPS its own paths-ignore: that one triggers on push to
# main and gates a deploy, not a required check, so skipping it is free.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same versions as the image (Dockerfile: node:20-alpine + pnpm@9.15.0), so
    # a green CI can't mean a red build.
    env:
      NEXT_PUBLIC_SITE_MODE: live
      NEXT_PUBLIC_PROJECTX_ORIGIN: https://shamankathmandu.com
      S3_PUBLIC_BASE: https://ims-shaman-photos.s3.ap-south-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # typecheck → lint → tests → i18n catalog parity.
      - name: Verify
        run: pnpm verify

      # No secrets on purpose — see the note at the top of this file.
      - name: Build
        run: pnpm build
